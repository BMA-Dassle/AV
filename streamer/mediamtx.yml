# MediaMTX config for the web-page streamer: RTSP only, any path, publishing from this PC only.
logLevel: info
rtsp: yes
rtspAddress: :8554
protocols: [tcp, udp]
rtmp: no
hls: no
webrtc: no
srt: no
api: no
metrics: no
authInternalUsers:
  # anyone on the network may watch; only this PC (the streamer) may publish
  - user: any
    ips: []
    permissions:
      - action: read
      - action: playback
  - user: any
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
paths:
  all_others:
